<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arch3 3D explorer · Riddhi Siddhi Apartment (demo)</title>
<style>
@font-face{font-family:"Geist";src:url(../assets/fonts/geist-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(../assets/fonts/geist-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#EDEFF2}
body{-webkit-font-smoothing:antialiased}
/* ===== 3D VIEWER (embeddable widget) =====
   Self-contained: every colour, font and radius comes from the --w-* tokens,
   so the widget can sit on any host page and be themed per builder.
   The layout follows the widget's own width (container queries), not the page's. */
#viewer{
  --w-bg:#FFFFFF; --w-bg-2:#F6F7F9; --w-bg-3:#EDEFF2; --w-line:#E3E6EA; --w-line-2:#EEF0F3;
  --w-ink:#0D1117; --w-ink-2:#4A5361; --w-ink-3:#7D8592;
  --w-accent:#0D1117; --w-accent-fg:#FFFFFF; --w-accent-h:#2A3039;
  --w-sel:#2563EB; --w-sel-t:#DCE7FD;
  --w-ok:#15803D; --w-hold:#A15C07; --w-bad:#B42318; --w-sold:#5B6472;
  --w-ok-f:#22A35A; --w-hold-f:#E39A1B; --w-bad-f:#E0524F; --w-sold-f:#A3ABB6;
  --w-ok-t:#D7F0DF; --w-hold-t:#FAE8C6; --w-bad-t:#F8D9D6; --w-sold-t:#E3E6EA;
  --w-glass:rgba(255,255,255,.92); --w-scrim:rgba(13,17,23,.82);
  --w-shadow:0 1px 2px rgba(13,17,23,.05),0 12px 32px -12px rgba(13,17,23,.22);
  --w-shadow-s:0 1px 2px rgba(13,17,23,.07),0 3px 10px -3px rgba(13,17,23,.14);
  --w-r:12px; --w-r-s:8px;
  --w-f:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --w-m:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --w-h:clamp(560px,80vh,820px); --w-side:372px; --ch:max(340px,56vh);
  container:v / inline-size;
  position:relative;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  border-radius:16px;background:var(--w-bg-3);border:1px solid var(--w-line);box-shadow:0 28px 56px -32px rgba(13,17,23,.38);
  font:400 14px/1.45 var(--w-f);color:var(--w-ink);text-align:left;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"
}
#viewer[data-theme="dark"]{
  --w-bg:#121519; --w-bg-2:#1A1E23; --w-bg-3:#22272D; --w-line:#2B3138; --w-line-2:#20252B;
  --w-ink:#F2F4F7; --w-ink-2:#B3BAC4; --w-ink-3:#838B97;
  --w-accent:#F2F4F7; --w-accent-fg:#0D1117; --w-accent-h:#D8DCE1;
  --w-sel:#5B93F7; --w-sel-t:#1D2C49;
  --w-ok:#4ADE80; --w-hold:#F5B544; --w-bad:#F87171; --w-sold:#A3ABB6;
  --w-ok-t:#163826; --w-hold-t:#3B2C12; --w-bad-t:#3F201F; --w-sold-t:#2B3138;
  --w-glass:rgba(18,21,25,.9); --w-scrim:rgba(0,0,0,.78);
  --w-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
  --w-shadow-s:0 1px 2px rgba(0,0,0,.4),0 3px 10px -3px rgba(0,0,0,.55);
}
:where(#viewer) *,:where(#viewer) *::before,:where(#viewer) *::after{box-sizing:border-box}
:where(#viewer) :is(h3,p,dl,dd,ul,li){margin:0;padding:0}
:where(#viewer) ul{list-style:none}
:where(#viewer) button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#viewer :focus-visible{outline:2px solid var(--w-sel);outline-offset:2px}
#viewer .w-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#viewer svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* canvas + overlays */
.v-canvas{position:relative;flex:none;height:var(--w-h)}
.v-canvas canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.v-canvas canvas:active{cursor:grabbing}
.v-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.v-topbar{position:absolute;left:12px;top:12px;z-index:3;display:flex;max-width:calc(100% - var(--w-side) - 24px);padding:3px;background:var(--w-glass);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);border:1px solid var(--w-line);border-radius:10px;box-shadow:var(--w-shadow-s)}
.v-crumbs{display:flex;flex-wrap:wrap;align-items:center;min-width:0}
.v-crumbs button{border:0;background:transparent;padding:6px 8px;border-radius:7px;font:500 12.5px/1 var(--w-f);color:var(--w-ink-3);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.v-crumbs button:hover{background:var(--w-bg-2);color:var(--w-ink)}
.v-crumbs button[aria-current]{color:var(--w-ink);font-weight:600}
.v-crumbs .sl{color:var(--w-ink-3);opacity:.45;font-size:12px;padding:0 1px}

/* side panel */
.v-panel{position:absolute;right:12px;top:12px;bottom:12px;width:360px;z-index:3;display:flex;flex-direction:column;background:var(--w-bg);border:1px solid var(--w-line);border-radius:var(--w-r);box-shadow:var(--w-shadow);overflow:hidden}
.v-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--w-line) transparent}
.w-head{padding:16px 18px 15px;border-bottom:1px solid var(--w-line)}
.w-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;line-height:1.3;color:var(--w-ink-3)}
.w-meta>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-live{display:inline-flex;align-items:center;gap:6px;flex:none;font:500 11px/1 var(--w-m);color:var(--w-ink-2);white-space:nowrap}
.w-live i{position:relative;width:6px;height:6px;border-radius:50%;background:var(--w-ok-f)}
.w-live i::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--w-ok-f);opacity:.25;animation:wpulse 2.4s ease-in-out infinite}
@keyframes wpulse{50%{transform:scale(1.6);opacity:0}}
.w-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.w-head h3{margin:0;font:600 19px/1.2 var(--w-f);letter-spacing:-.015em;color:var(--w-ink);min-width:0}
.w-sub{margin:5px 0 0;font-size:13px;line-height:1.5;color:var(--w-ink-2)}
.w-sec{padding:14px 18px 16px;border-bottom:1px solid var(--w-line-2)}
.w-sec:last-child{border-bottom:0}
.w-lbl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;font:500 12px/1.2 var(--w-f);color:var(--w-ink-3)}
.w-note{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--w-ink-3)}
.w-foot{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--w-line);background:var(--w-bg)}
.w-foot-2{display:grid;grid-template-columns:auto 1fr}
.w-brand{margin-left:auto;font-size:11.5px;color:var(--w-ink-3);white-space:nowrap}
.w-brand b{font-weight:600;color:var(--w-ink-2)}

/* controls */
.w-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--w-line);border-radius:var(--w-r-s);background:var(--w-bg);font:500 13px/1 var(--w-f);color:var(--w-ink);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.w-btn:hover{background:var(--w-bg-2)}
.w-btn.pri{background:var(--w-accent);border-color:var(--w-accent);color:var(--w-accent-fg)}
.w-btn.pri:hover{background:var(--w-accent-h);border-color:var(--w-accent-h)}
.w-btn.ghost{height:32px;padding:0 10px 0 6px;margin-left:-6px;border-color:transparent;background:transparent;color:var(--w-ink-2)}
.w-btn.ghost:hover{background:var(--w-bg-2);color:var(--w-ink)}
.w-search{display:flex;height:38px;border:1px solid var(--w-line);border-radius:var(--w-r-s);background:var(--w-bg);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.w-search:focus-within{border-color:var(--w-sel);box-shadow:0 0 0 3px var(--w-sel-t)}
.w-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 12px;font:500 13.5px var(--w-m);letter-spacing:.02em;color:var(--w-ink);text-transform:uppercase}
.w-search input::placeholder{font:400 13px var(--w-f);letter-spacing:0;text-transform:none;color:var(--w-ink-3)}
.w-search button{display:flex;align-items:center;gap:6px;border:0;border-left:1px solid var(--w-line);background:var(--w-bg-2);padding:0 12px 0 14px;font:500 13px var(--w-f);color:var(--w-ink);cursor:pointer}
.w-search button:hover{background:var(--w-bg-3)}
.v-err{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--w-bad)}
.w-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--w-bg-2);border:1px solid var(--w-line-2);border-radius:9px}
.w-seg button{border:0;background:transparent;padding:8px;border-radius:6px;font:500 12.5px/1.2 var(--w-f);color:var(--w-ink-2);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.w-seg button:hover{color:var(--w-ink)}
.w-seg button.on{background:var(--w-bg);color:var(--w-ink);box-shadow:var(--w-shadow-s)}
.w-step{display:inline-flex;flex:none;border:1px solid var(--w-line);border-radius:var(--w-r-s);overflow:hidden}
.w-step button{display:grid;place-items:center;width:34px;height:32px;border:0;background:var(--w-bg);color:var(--w-ink);cursor:pointer}
.w-step button+button{border-left:1px solid var(--w-line)}
.w-step button:hover:not(:disabled){background:var(--w-bg-2)}
.w-step button:disabled{color:var(--w-ink-3);opacity:.4;cursor:default}

/* status */
.s-available{background:var(--w-ok-f)}.s-hold{background:var(--w-hold-f)}.s-booked{background:var(--w-bad-f)}.s-sold{background:var(--w-sold-f)}
.w-st{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--w-f);white-space:nowrap}
.w-st i{width:7px;height:7px;border-radius:2px;flex:none}
.st-available{color:var(--w-ok)}.st-available i{background:var(--w-ok-f)}
.st-hold{color:var(--w-hold)}.st-hold i{background:var(--w-hold-f)}
.st-booked{color:var(--w-bad)}.st-booked i{background:var(--w-bad-f)}
.st-sold{color:var(--w-sold)}.st-sold i{background:var(--w-sold-f)}
.w-badge{flex:none;padding:6px 9px;border:1px solid var(--w-line);border-radius:999px;background:var(--w-bg)}
.w-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11.5px;color:var(--w-ink-2)}
.w-legend span{display:inline-flex;align-items:center;gap:6px}
.w-sq{width:8px;height:8px;border-radius:2px;flex:none}

/* project: wings + totals */
.w-list{display:grid;gap:8px}
.w-wing{display:grid;grid-template-columns:36px minmax(0,1fr) auto 16px;align-items:center;gap:0 12px;width:100%;padding:12px 10px 12px 12px;border:1px solid var(--w-line);border-radius:10px;background:var(--w-bg);text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.w-wing:hover{border-color:var(--w-ink-3)}
.w-wing>svg{color:var(--w-ink-3)}
.w-wing-id{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--w-bg-2);border:1px solid var(--w-line-2);font:600 15px/1 var(--w-m);color:var(--w-ink)}
.w-wing-t b{display:block;font:600 14px/1.25 var(--w-f);color:var(--w-ink)}
.w-wing-t small{display:block;margin-top:3px;font-size:12px;color:var(--w-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-wing-n{text-align:right;line-height:1.15}
.w-wing-n b{display:block;font:600 15px/1.1 var(--w-m);color:var(--w-ink)}
.w-wing-n small{display:block;font:400 11px/1.3 var(--w-m);color:var(--w-ink-3)}
.w-bar{grid-column:1/-1;display:flex;gap:2px;height:4px;margin-top:12px}
.w-bar i{display:block;min-width:3px;border-radius:1px}
.w-totals{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--w-line);border-radius:10px;overflow:hidden}
.w-totals div{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;color:var(--w-ink-2)}
.w-totals div:nth-child(odd){border-right:1px solid var(--w-line)}
.w-totals div:nth-child(-n+2){border-bottom:1px solid var(--w-line)}
.w-totals b{margin-left:auto;font:600 13px var(--w-m);color:var(--w-ink)}

/* wing: stacking plan */
.w-flrs{display:grid;gap:6px}
.w-flr{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:1px solid var(--w-line);border-radius:var(--w-r-s);background:var(--w-bg);color:var(--w-ink);font:500 14px/1 var(--w-f);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.w-flr:hover{background:var(--w-bg-2);border-color:var(--w-ink-3)}
.w-flr:focus-visible{outline:2px solid var(--w-sel);outline-offset:2px}
.w-flr .av{margin-left:auto;font-size:13px;color:var(--w-ok)}
.w-flr .av.zero{color:var(--w-ink-3)}
.w-flr svg{flex:none;width:14px;height:14px;color:var(--w-ink-3)}

/* floor: flats + key plan */
.w-units{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w-unit{display:flex;flex-direction:column;gap:7px;padding:10px 11px;border:1px solid var(--w-line);border-radius:var(--w-r-s);background:var(--w-bg);text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.w-unit:hover{border-color:var(--w-ink-3)}
.w-unit .r1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.w-unit b{font:600 13.5px/1 var(--w-m);letter-spacing:-.01em;color:var(--w-ink)}
.w-unit small{font-size:12px;line-height:1.2;color:var(--w-ink-3)}
.w-unit.u-booked b,.w-unit.u-sold b{color:var(--w-ink-2)}
.w-unit.w-am{cursor:default;background:var(--w-bg-2);border-style:dashed}.w-unit.w-am:hover{border-color:var(--w-line)}.w-unit.w-am b{font:600 13px/1.1 var(--w-f);letter-spacing:0}
.w-kp{display:flex;align-items:flex-end;gap:18px;padding:12px;background:var(--w-bg-2);border:1px solid var(--w-line-2);border-radius:var(--w-r-s)}
.kp{display:block;flex:none;height:212px;width:auto;max-width:62%}
.w-kp-key{display:grid;gap:9px;padding-bottom:2px;font-size:11.5px;line-height:1.2;color:var(--w-ink-2)}
.w-kp-key span{display:flex;align-items:center;gap:8px;white-space:nowrap}
.k-available{background:var(--w-ok-t);box-shadow:inset 0 0 0 1px var(--w-ok-f)}.k-hold{background:var(--w-hold-t);box-shadow:inset 0 0 0 1px var(--w-hold-f)}
.k-booked{background:var(--w-bad-t);box-shadow:inset 0 0 0 1px var(--w-bad-f)}.k-sold{background:var(--w-sold-t);box-shadow:inset 0 0 0 1px var(--w-sold-f)}.k-sel{background:var(--w-sel)}
.kp-flat rect{stroke:var(--w-bg-2);stroke-width:1.4;cursor:pointer;transition:fill .15s}
.kp-available rect{fill:var(--w-ok-t)}.kp-hold rect{fill:var(--w-hold-t)}.kp-booked rect{fill:var(--w-bad-t)}.kp-sold rect{fill:var(--w-sold-t)}
.kp-flat:hover rect{fill:var(--w-sel-t)}.kp-flat.sel rect{fill:var(--w-sel)}
.kp-flat text{font:600 10px var(--w-m);fill:var(--w-ink);text-anchor:middle;pointer-events:none}
.kp-flat.sel text{fill:#fff}
.kp-am rect{fill:var(--w-bg-3);stroke:var(--w-bg-2);stroke-width:1.4}
.kp-am text{font:500 7px var(--w-m);fill:var(--w-ink-3);text-anchor:middle}
.kp-road{font:500 8px var(--w-m);fill:var(--w-ink-3);text-anchor:middle;letter-spacing:.03em}

/* flat + inside */
.w-dl{margin:0}
.w-dl>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--w-line-2);font-size:13px}
.w-dl>div:first-child{padding-top:0}.w-dl>div:last-child{padding-bottom:0;border-bottom:0}
.w-dl dt{color:var(--w-ink-2)}
.w-dl dd{margin:0;font-weight:500;color:var(--w-ink);text-align:right}
.w-dl dd.mono{font:500 12.5px/1.45 var(--w-m)}
.w-rooms{margin:0 -8px;padding:0;list-style:none}
.w-rooms li{display:flex;justify-content:space-between;gap:12px;padding:8px;border-radius:6px;font-size:13px;color:var(--w-ink);cursor:default;transition:background .15s}
.w-rooms li+li{box-shadow:inset 0 1px var(--w-line-2)}
.w-rooms li:hover{background:var(--w-bg-2);box-shadow:none}
.w-rooms li:hover+li{box-shadow:none}
.w-rooms b{font:500 12.5px/1.45 var(--w-m);color:var(--w-ink-2)}

/* toolbar, compass, plan switch */
.v-tools{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:8px}
.w-tb{display:flex;align-items:center;gap:2px;padding:3px;background:var(--w-glass);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);border:1px solid var(--w-line);border-radius:10px;box-shadow:var(--w-shadow-s)}
.w-tb button{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--w-ink-2);cursor:pointer;transition:background .15s,color .15s}
.w-tb button:hover{background:var(--w-bg-2);color:var(--w-ink)}
.w-tb button.on{background:var(--w-accent);color:var(--w-accent-fg)}
.w-tb .sep{width:1px;height:18px;margin:0 3px;background:var(--w-line)}
.v-tools svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.v-compass{position:relative;display:block;width:40px;height:40px;border-radius:50%;background:var(--w-glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--w-line);box-shadow:var(--w-shadow-s)}
.v-compass i{position:absolute;inset:5px;display:block}
.v-compass i::before{content:"";position:absolute;left:50%;top:3px;height:calc(50% - 3px);width:2px;margin-left:-1px;border-radius:1px;background:var(--w-ink)}
.v-compass i::after{content:"ROAD";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);font:600 6px/1 var(--w-m);letter-spacing:.04em;color:var(--w-ink-3)}
.v-plan{position:absolute;top:12px;right:calc(var(--w-side) + 12px);z-index:3;display:flex;gap:2px;padding:3px;background:var(--w-glass);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);border:1px solid var(--w-line);border-radius:10px;box-shadow:var(--w-shadow-s)}
.v-plan button{border:0;background:transparent;padding:7px 11px;border-radius:7px;font:400 12.5px/1 var(--w-f);color:var(--w-ink-2);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.v-plan button b{font-weight:600;color:var(--w-ink)}
.v-plan button:hover{background:var(--w-bg-2)}
.v-plan button.on{background:var(--w-accent);color:color-mix(in srgb,var(--w-accent-fg) 72%,transparent)}
.v-plan button.on b{color:var(--w-accent-fg)}

/* hint, toast, tooltip, full screen */
.v-hint{margin:0;position:absolute;left:calc((100% - var(--w-side)) / 2);bottom:16px;z-index:2;transform:translateX(-50%);padding:8px 12px;border-radius:8px;background:var(--w-scrim);color:#fff;font:500 12px/1 var(--w-f);white-space:nowrap;pointer-events:none;transition:opacity .4s}
.v-hint.gone{opacity:0}

.v-labels.furn .rlabel{flex-direction:row;gap:6px;padding:3px 8px;background:var(--w-glass)}

/* Premium: photo-quality views at eye level (drag to look around) */
.v-photo{position:absolute;left:0;top:0;bottom:0;right:calc(var(--w-side) - 8px);z-index:2;overflow:hidden;background:#15181c;-webkit-user-select:none;user-select:none}

.v-photo-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 14px;border-radius:999px;background:var(--w-scrim);color:#fff;font:500 12.5px/1 var(--w-f);pointer-events:none;transition:opacity .5s}

#viewer.v-prem .v-labels,#viewer.v-prem .v-hint,#viewer.v-prem .v-compass,#viewer.v-prem .w-tb [data-act="reset"],#viewer.v-prem .w-tb [data-act="labels"],#viewer.v-prem .w-tb .sep{display:none}

.w-seg.tiers button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px}

.w-seg.tiers span{font-size:11.5px;color:var(--w-ink-3)}

.w-views img{flex:none;width:66px;height:44px;object-fit:cover;border-radius:5px;background:var(--w-bg-2)}
.w-views b{display:block;font:500 13px/1.25 var(--w-f);color:var(--w-ink)}
.w-views small{display:block;margin-top:3px;font:400 11.5px/1.2 var(--w-m);color:var(--w-ink-3)}

/* Premium: photo-real front views of the building (drag to turn) */
.v-orbit{position:absolute;left:0;top:0;bottom:0;right:calc(var(--w-side) - 8px);z-index:2;overflow:hidden;background:#cfd8e0;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}

.v-orbit>button{position:absolute;z-index:2;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--w-line);border-radius:50%;background:var(--w-glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--w-shadow-s);color:var(--w-ink);cursor:pointer}

#viewer.v-orb .v-labels,#viewer.v-orb .v-hint,#viewer.v-orb .v-compass,#viewer.v-orb .w-tb [data-act="reset"],#viewer.v-orb .w-tb [data-act="labels"],#viewer.v-orb .w-tb [data-act="zin"],#viewer.v-orb .w-tb [data-act="zout"],#viewer.v-orb .w-tb .sep{display:none}

/* hide / show the side panel so the view can use the full width */
.v-panel{transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .35s}

.v-side{position:absolute;z-index:4;top:50%;right:var(--w-side);transform:translateY(-50%);display:grid;place-items:center;width:22px;height:56px;padding:0;border:1px solid var(--w-line);border-right:0;border-radius:8px 0 0 8px;background:var(--w-glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--w-shadow-s);color:var(--w-ink-2);cursor:pointer}

.v-side svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}

/* medium widths: plan switch and hint move clear of the crumbs and toolbar */
@container v (max-width: 1100px){
  .v-plan{right:auto;left:12px;top:56px}
  .v-hint{bottom:64px}
}
/* narrow (phones, small embeds): panel goes below the 3D */
@container v (max-width: 820px){
  .v-canvas{height:var(--ch)}
  .v-labels{bottom:auto;height:var(--ch)}
  .v-panel{position:relative;inset:auto;width:auto;border:0;border-top:1px solid var(--w-line);border-radius:0;box-shadow:none}

  #viewer.v-collapsed .v-panel{transform:none;opacity:1;pointer-events:auto}
  #viewer.v-collapsed{--w-side:372px}
  .v-body{overflow:visible}
  .w-head,.w-sec,.w-foot{padding-left:16px;padding-right:16px}
  .w-foot{position:static}
  .v-topbar{left:10px;top:10px;max-width:calc(100% - 20px)}
  .v-tools{left:10px;bottom:auto;top:calc(var(--ch) - 50px)}
  #viewer.v-prem .v-tools{bottom:auto;top:calc(var(--ch) - 96px)}
  .v-hint{left:50%;bottom:auto;top:calc(var(--ch) - 92px)}
  .v-plan{left:auto;right:10px;top:calc(var(--ch) - 94px)}
  .v-plan button{padding:7px 10px;font-size:12px}
  .v-plan button span{display:none}
  .v-photo{right:0;bottom:auto;height:var(--ch)}
  .v-photo-rooms{left:10px;bottom:10px;max-width:calc(100% - 20px)}
  .v-orbit{right:0;bottom:auto;height:var(--ch)}.v-orb-next{right:10px}.v-orb-tag{right:10px;bottom:10px}.v-orb-hint{bottom:auto;top:52px}
  .v-mini{right:10px;bottom:auto;top:52px;padding:6px}.v-mini svg{width:84px}.v-mini span{display:none}
  .v-toast{left:50%;top:calc(var(--ch) - 146px);width:max-content;max-width:calc(100% - 24px);white-space:normal}
  .v-labels.furn .rlabel{padding:2px 7px}.v-labels.furn .rlabel b{font-size:10.5px}
  #viewer.v-full .v-canvas{flex:none;height:var(--ch)}

  #viewer.v-full .w-foot{position:sticky}
  #viewer.v-full .v-exit{display:grid}

}
#viewer.v-full{--ch:62vh;--ch:62dvh}
@media (prefers-reduced-motion: reduce){.w-live i::after{animation:none}.v-toast{animation:none}}


/* embed: the widget fills the frame */
#viewer{--w-h:100vh;--w-h:100dvh;border:0;border-radius:0;box-shadow:none;min-height:100%}
