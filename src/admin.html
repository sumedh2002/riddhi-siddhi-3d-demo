<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storey3D Sales Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a sales-office inventory board. One chart, one side panel, everything else quiet. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF1F5; --line:#E1E6ED;
  --fg:#111827; --fg-2:#4B5565; --fg-3:#8A94A6;
  --accent:#1E4FD6; --accent-fg:#FFFFFF; --accent-soft:#E7EDFC;
  --av:#15803D; --av-bg:#DFF3E6; --av-fg:#14532D;
  --ho:#C2780A; --ho-bg:#FBEFD3; --ho-fg:#6B4405;
  --bo:#C2323A; --bo-bg:#FBE3E3; --bo-fg:#7A1D22;
  --so:#5E6878; --so-bg:#E6E9EE; --so-fg:#3E4655;
  --shadow:0 18px 40px -18px rgba(17,24,39,.35);
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#161B23; --surface-2:#1D232D; --line:#2A313C;
  --fg:#EEF1F6; --fg-2:#B3BCCB; --fg-3:#7D8798;
  --accent:#86A8FF; --accent-fg:#0B1220; --accent-soft:#1C2843;
  --av:#4ADE80; --av-bg:#153020; --av-fg:#BDF2CF;
  --ho:#F5B544; --ho-bg:#3A2B10; --ho-fg:#F8DDA6;
  --bo:#F87171; --bo-bg:#3B1B1D; --bo-fg:#F8C4C4;
  --so:#9AA3B2; --so-bg:#262C36; --so-fg:#C3CAD5;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#161B23; --surface-2:#1D232D; --line:#2A313C;
  --fg:#EEF1F6; --fg-2:#B3BCCB; --fg-3:#7D8798;
  --accent:#86A8FF; --accent-fg:#0B1220; --accent-soft:#1C2843;
  --av:#4ADE80; --av-bg:#153020; --av-fg:#BDF2CF;
  --ho:#F5B544; --ho-bg:#3A2B10; --ho-fg:#F8DDA6;
  --bo:#F87171; --bo-bg:#3B1B1D; --bo-fg:#F8C4C4;
  --so:#9AA3B2; --so-bg:#262C36; --so-fg:#C3CAD5;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
h1,h2,h3,p,ul,fieldset{margin:0}
ul{padding:0;list-style:none}
fieldset{border:0;padding:0;min-width:0}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--fg-2)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.page{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.15}
.brand-t b{font-weight:800;letter-spacing:-.01em}
.brand-t small{font-size:.74rem;color:var(--fg-3);font-weight:600}
.me{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;font-weight:800;font-size:.78rem}
.who{display:flex;flex-direction:column;line-height:1.2}
.who b{font-size:.86rem;font-weight:700}.who small{font-size:.74rem;color:var(--fg-3)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
@media (max-width:560px){.who{display:none}}

/* page */
.page{padding-block:28px 40px;display:flex;flex-direction:column;gap:24px}
@media (min-width:760px){.page{padding-block:36px 56px}}
.crumbs{display:flex;gap:8px;font-size:.84rem;color:var(--fg-3);margin-bottom:-12px}
.crumbs a{color:var(--fg-2);font-weight:600}.crumbs a:hover{color:var(--accent)}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.ph > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
h1{font-size:clamp(1.5rem,3vw,1.85rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h2{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:.95rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.danger{background:var(--bo);border-color:var(--bo);color:#fff}
.btn.small{height:32px;padding:0 10px;font-size:.82rem}
.btn.block{width:100%}
.btn .i{width:16px;height:16px}
.txt-link{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.88rem;color:var(--accent)}
.txt-link .i{width:15px;height:15px}
.txt-link:hover{text-decoration:underline;text-underline-offset:3px}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-in{width:min(380px,100%);display:flex;flex-direction:column;gap:24px}
.login h1{font-size:1.6rem}
.login form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:700;color:var(--fg-2)}
.field input{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:1rem;font-weight:500;background:var(--surface);color:var(--fg)}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.login .note{font-size:.82rem;color:var(--fg-3)}

/* project card */
.proj{display:grid;grid-template-columns:200px minmax(0,1fr) auto;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.proj:hover{border-color:var(--fg-3)}
.proj img{width:100%;height:100%;min-height:150px;object-fit:cover;display:block;max-width:100%}
.proj-b{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.proj-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--av)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--av)}
.proj-go{display:flex;align-items:center;gap:6px;padding:0 20px;font-weight:700;font-size:.9rem;color:var(--accent);white-space:nowrap}
@media (max-width:720px){.proj{grid-template-columns:1fr}.proj img{height:140px;min-height:0}.proj-go{padding:0 20px 18px}}
.statbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.statbar i{display:block;height:100%}
.counts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.86rem;color:var(--fg-2)}
.counts span{display:inline-flex;align-items:center;gap:6px}
.counts b{color:var(--fg);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-available,.statbar .available{background:var(--av)}
.d-hold,.statbar .hold{background:var(--ho)}
.d-booked,.statbar .booked{background:var(--bo)}
.d-sold,.statbar .sold{background:var(--so)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:-8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{height:34px;padding:0 14px;border-radius:8px;font-weight:700;font-size:.88rem;color:var(--fg-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(17,24,39,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.84rem;font-weight:600;color:var(--fg-2);white-space:nowrap}
.chip b{color:var(--fg);font-weight:800}
.chip:hover{border-color:var(--fg-3)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.on b{color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg-3)}
.search:focus-within{outline:2px solid var(--accent);border-color:transparent}
.search input{border:0;outline:0;background:transparent;width:150px;font-weight:600;color:var(--fg)}
.search input::placeholder{color:var(--fg-3);font-weight:500}

/* board + panel */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:959px){.layout{grid-template-columns:minmax(0,1fr)}.panel{display:none}}
.board{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.board-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.chart-wrap{overflow-x:auto}
table.chart{width:100%;border-collapse:separate;border-spacing:6px;margin:-6px}
table.chart th{font-weight:700;color:var(--fg-3);font-size:.74rem}
table.chart thead th{text-align:center;padding-bottom:2px;line-height:1.25}
table.chart thead th small{display:block;font-weight:600;font-size:.66rem}
table.chart tbody th{text-align:left;white-space:nowrap;padding-right:6px;font-size:.78rem;color:var(--fg-2)}
.cell{position:relative;width:100%;height:44px;min-width:44px;border-radius:9px;font-weight:700;font-size:.86rem;font-variant-numeric:tabular-nums;transition:transform .1s,box-shadow .12s,opacity .12s}
.cell:hover{transform:translateY(-1px)}
.st-available{background:var(--av-bg);color:var(--av-fg)}
.st-hold{background:var(--ho-bg);color:var(--ho-fg)}
.st-booked{background:var(--bo-bg);color:var(--bo-fg)}
.st-sold{background:var(--so-bg);color:var(--so-fg)}
.cell.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.cell.dim{opacity:.18}
.cell .note{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.fl-s{display:none}
@media (max-width:560px){
  .board{padding:14px;border-radius:14px}
  table.chart{border-spacing:4px;margin:-4px}
  table.chart thead th small{font-size:.58rem}
  .cell{min-width:0;height:40px;font-size:.74rem;border-radius:7px}
  .fl-l{display:none}.fl-s{display:inline}
  table.chart tbody th{padding-right:2px;font-size:.72rem}
  .toolbar{flex-direction:column;align-items:stretch;gap:10px}
  .seg{display:flex}.seg button{flex:1}
  .chips{flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0;max-width:100%}
  .toolbar,.page > *{min-width:0;max-width:100%}
  .chips::-webkit-scrollbar{display:none}
  .search input{width:100%}
}

.panel{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.empty-panel{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:8px 2px}
.empty-panel .i{width:28px;height:28px;color:var(--fg-3);margin-bottom:4px}
.ed{display:flex;flex-direction:column;gap:18px}
.ed-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ed-h > div{display:flex;flex-direction:column;gap:2px}
.ed-h h2{font-size:1.5rem;letter-spacing:-.02em}
.lbl{display:block;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;color:var(--fg)}
.opt:hover{border-color:var(--fg-3)}
.opt.on.st-available{background:var(--av-bg);border-color:var(--av);color:var(--av-fg)}
.opt.on.st-hold{background:var(--ho-bg);border-color:var(--ho);color:var(--ho-fg)}
.opt.on.st-booked{background:var(--bo-bg);border-color:var(--bo);color:var(--bo-fg)}
.opt.on.st-sold{background:var(--so-bg);border-color:var(--so);color:var(--so-fg)}
.opt:not(.on){background:var(--surface);color:var(--fg)}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;background:var(--surface);color:var(--fg)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hint{font-size:.78rem;color:var(--fg-3);margin-top:6px}
.ed-foot{display:flex;flex-direction:column;gap:12px}
.ed-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--fg-3)}

/* activity */
.sec{display:flex;flex-direction:column;gap:6px}
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act-id{font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:7px;background:var(--surface-2)}
.act-id:hover{background:var(--accent-soft);color:var(--accent)}
.act-what{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.88rem;color:var(--fg-2)}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--fg)}
.act time{font-size:.78rem;color:var(--fg-3);white-space:nowrap}
.act-rm{grid-column:2/4;font-size:.84rem;color:var(--fg-2)}
.act.compact{grid-template-columns:minmax(0,1fr) auto}
.act.compact .act-rm{grid-column:1/3}
.none{font-size:.88rem;color:var(--fg-3);padding:8px 0}

.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-top:20px;border-top:1px solid var(--line);font-size:.82rem;color:var(--fg-3)}
.foot p{max-width:60ch}
.reset{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.reset .txt-link{color:var(--fg-2);font-size:.82rem}

/* phone sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:90vh;max-height:90dvh;overflow:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
html.lock,html.lock body{overflow:hidden}
@keyframes up{from{transform:translateY(32px);opacity:.5}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);font-size:.88rem;font-weight:600;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 32px);animation:up .22s ease-out}
.toast .i{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<img id="thumb" src="{{img:thumb}}" alt="" hidden>
<script>{{script}}</script>
</body>
</html>
